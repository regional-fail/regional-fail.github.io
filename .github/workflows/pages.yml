# Build and publish the website to GitHub Pages.
# Live numbers are NOT baked in: the site reads them from the `live` branch and the archive at view time.
# What gets built here: the pages, the shared scoring code, and the line map (from the cached timetable).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'logger/lib/**', '.github/workflows/pages.yml']
  # The logger's own commits (e.g. a new SEPTA timetable) don't trigger workflows, so also rebuild daily.
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble site
        run: |
          node site/build_network.mjs
          mkdir -p _site
          cp -r site/. _site/
          rm -f _site/build_network.mjs _site/build_images.mjs
          mkdir -p _site/lib
          cp logger/lib/summary.mjs logger/lib/classify.mjs logger/lib/rules.mjs logger/lib/geo.mjs _site/lib/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
